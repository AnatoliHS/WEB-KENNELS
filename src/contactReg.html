---
layout: reg.njk
---




    <div class="scene">
  <div class="contact-box" style="--p: 20px; --bgc: rgba(255, 255, 255, 0.5); --radius: 10px;  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);  --mt:30px; --mb:30px;  --maxw: 800px; --w: 95vw;">
      <h1 style="font-size: 2rem;
        font-weight: bold;
        background: linear-gradient(90deg, #0968e5, #091970);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-fill-color: transparent;
        --mt: 0; 
        --ta: center;" >Contact Us</h1>
      <form action="https://formsubmit.co/a4fc1e3fbe29d4078d38d1e81fec4f59" method="POST">

    <input type="text" name="_honey" style="display:none">

    <input type="hidden" name="_subject" value="New Inquiry - WHMIS Wise Website">

    <input type="hidden" name="_captcha" value="false">

    <input type="hidden" name="_next" value="https://whmiswise.com/thanksReg">

    <label style="--mb: 8px; --weight: bold; --d: block;" for="name">Name</label>
    <input style=" --shadow-hard:2; --w: 100%; --p: 10px; --mb: 10px; --b: 1px solid #ccc;  --radius: 20px;" type="text" id="name" name="name" required>

    <label style="--mb: 8px; --weight: bold;" for="email">Email</label>
    <input style=" --shadow-hard:2; --w: 100%; --p: 10px; --mb: 10px; --b: 1px solid #ccc; --radius: 20px;" type="email" id="email" name="email" required>

    <label style="--mb: 8px; --weight: bold;" for="message">Message</label>
    <textarea style=" --shadow-hard:2; --w: 100%; --p: 10px; --mb: 10px; --b: 1px solid #ccc; --radius: 20px;" id="message" name="message" rows="5" required></textarea>

    <div class="button-row">
        <div class="button-wrap">
            <button class="glass-button" type="submit">
            <span>SEND</span>
            </button>
            <div class="button-shadow"></div>
        </div>
    </div>

</form>
  </div>
</div>
    
    <style>
/* 3D Rise-up Animation */
.scene {
  perspective: 1000px;
  display: flex;
  justify-content: center;
  margin-top: 50px;
}

.contact-box {
  transform-origin: center center;
  transform: rotateX(90deg);
  animation: flipInX 1s ease-out forwards;
}

@keyframes flipInX {
  0% {
    transform: rotateX(90deg);
    opacity: 0;
  }
  40% {
    transform: rotateX(-20deg);
  }
  60% {
    transform: rotateX(10deg);
    opacity: 1;
  }
  80% {
    transform: rotateX(-5deg);
  }
  100% {
    transform: rotateX(0deg);
  }
}


    @property --angle-1 {
      syntax: "<angle>";
      inherits: false;
      initial-value: -75deg;
    }

    @property --angle-2 {
      syntax: "<angle>";
      inherits: false;
      initial-value: -45deg;
    }

    :root {
      --global--size: clamp(2rem, 4vw, 5rem);
      --anim--hover-time: 400ms;
      --anim--hover-ease: cubic-bezier(0.25, 1, 0.5, 1);
    }

    .button-wrap {
      position: relative;
      z-index: 2;
      border-radius: 999vw;
      background: transparent;
      pointer-events: none;
      transition: all var(--anim--hover-time) var(--anim--hover-ease);
    }

    .button-shadow {
      --shadow-cuttoff-fix: 2em;
      position: absolute;
      width: calc(100% + var(--shadow-cuttoff-fix));
      height: calc(100% + var(--shadow-cuttoff-fix));
      top: calc(0% - var(--shadow-cuttoff-fix) / 2);
      left: calc(0% - var(--shadow-cuttoff-fix) / 2);
      filter: blur(clamp(2px, 0.125em, 12px));
      pointer-events: none;
    }

    .button-shadow::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999vw;
      background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.1));
      width: calc(100% - var(--shadow-cuttoff-fix) - 0.25em);
      height: calc(100% - var(--shadow-cuttoff-fix) - 0.25em);
      top: calc(var(--shadow-cuttoff-fix) - 0.5em);
      left: calc(var(--shadow-cuttoff-fix) - 0.875em);
      padding: 0.125em;
      box-sizing: border-box;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }

    .glass-button {
      --border-width: clamp(1px, 0.0625em, 4px);
      all: unset;
      cursor: pointer;
      position: relative;
      z-index: 3;
      pointer-events: auto;
      border-radius: 999vw;
      background: linear-gradient(-75deg, rgba(1, 213, 255,0.05), rgba(1, 213, 255,0.2), rgba(1, 213, 255,0.05));
      box-shadow:
        inset 0 0.125em 0.125em rgba(0,0,0,0.05),
        inset 0 -0.125em 0.125em rgba(255,255,255,0.5),
        0 0.25em 0.125em -0.125em rgba(0,0,0,0.2),
        0 0 0.1em 0.25em inset rgba(255,255,255,0.2),
        0 0 0 0 rgba(255,255,255,1);
      backdrop-filter: blur(clamp(1px, 0.125em, 4px));
      transition: all var(--anim--hover-time) var(--anim--hover-ease);
      min-width: 220px;
      text-align: center;
      font-size: 25px;
      -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
          user-select: none;
    }

    .glass-button:hover {
      transform: scale(0.975);
      backdrop-filter: blur(0.01em);
      box-shadow:
        inset 0 0.125em 0.125em rgba(0,0,0,0.05),
        inset 0 -0.125em 0.125em rgba(255,255,255,0.5),
        0 0.15em 0.05em -0.1em rgba(0,0,0,0.25),
        0 0 0.05em 0.1em inset rgba(255,255,255,0.5),
        0 0 0 0 rgba(255,255,255,1);
    }

    .glass-button span {
      display: block;
      position: relative;
      font-weight: 500;
      letter-spacing: -0.05em;
      color: #323232;
      text-shadow: 0em 0.25em 0.05em rgba(0,0,0,0.1);
      padding: 0.875em 1.5em;
    }

    .glass-button span::after {
      content: "";
      position: absolute;
      z-index: 1;
      width: calc(100% - var(--border-width));
      height: calc(100% - var(--border-width));
      top: calc(var(--border-width) / 2);
      left: calc(var(--border-width) / 2);
      border-radius: 999vw;
      background: linear-gradient(var(--angle-2), rgba(255,255,255,0) 0%, rgba(255,255,255,0.5) 40% 50%, rgba(255,255,255,0) 55%);
      background-size: 200% 200%;
      background-position: 0% 50%;
      mix-blend-mode: screen;
      pointer-events: none;
      transition: background-position calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease), --angle-2 calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease);
    }

    .glass-button:hover span::after {
      background-position: 25% 50%;
    }

    .glass-button:active span::after {
      background-position: 50% 15%;
      --angle-2: -15deg;
    }

    .glass-button::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999vw;
      width: calc(100% + var(--border-width));
      height: calc(100% + var(--border-width));
      top: calc(0% - var(--border-width) / 2);
      left: calc(0% - var(--border-width) / 2);
      padding: var(--border-width);
      background: conic-gradient(
        from var(--angle-1) at 50% 50%,
        rgba(0,0,0,0.5),
        rgba(0,0,0,0) 5% 40%,
        rgba(0,0,0,0.5) 50%,
        rgba(0,0,0,0) 60% 95%,
        rgba(0,0,0,0.5)
      ),
      linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.5));
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      transition: all var(--anim--hover-time) var(--anim--hover-ease), --angle-1 500ms ease;
      box-shadow: inset 0 0 0 calc(var(--border-width) / 2) rgba(255,255,255,0.5);
    }

    .glass-button:hover::after {
      --angle-1: -125deg;
    }

    .glass-button:active::after {
      --angle-1: -75deg;
    }

    .button-container {
      --w: 100%;
      --ai: center;
      --fd: column;
      --d: flex;
      --mt: 50px;
      display: flex;
      align-items: center;
      flex-direction: column;
      margin-top: 50px;
    }

    .button-row {
      display: flex;
      justify-content: center;
      flex-direction: row;
      flex-wrap: wrap;
      max-width: 1100px;
      padding: 0 5vw;
      gap: 80px;
      
    }
    @media (max-width: 768px) {
       
        .button-row {
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 0 5vw;
        }
            
        .button-wrap {
            width: 100%;
        }

        .glass-button {
            width: 100%;
            
        }
        
    }
  </style>
