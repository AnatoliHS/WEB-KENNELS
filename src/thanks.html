---
layout: reg.njk
---

<div class="scene">
  <div class="contact-box" style="--p: 40px; --bgc: rgba(255, 255, 255, 0.5); --radius: 10px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25); --mt:50px; --mb:30px; --maxw: 600px; --w: 90vw; text-align: center;">
      
      <h1 style="font-size: 2.5rem; margin-bottom: 20px; font-weight: bold; background: linear-gradient(90deg, #0968e5, #091970); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-fill-color: transparent;">
          Message Sent!
      </h1>
      
      <p style="font-size: 1.2rem; margin-bottom: 40px; color: #323232; font-weight: 500;">
          Thank you for contacting WHMIS Wise. We have received your inquiry and will be in touch shortly.
      </p>

      <div class="button-row" style="justify-content: center;">
          <div class="button-wrap">
              <a href="/" class="glass-button" style="display: inline-block; text-decoration: none; color: #323232;">
                  <span>BACK TO HOME</span>
              </a>
              <div class="button-shadow"></div>
          </div>
      </div>

  </div>
</div>

<style>
/* 3D Animation */
.scene { perspective: 1000px; display: flex; justify-content: center; margin-top: 50px; }
.contact-box { transform-origin: center center; animation: flipInX 1s ease-out forwards; }
@keyframes flipInX {
  0% { transform: rotateX(90deg); opacity: 0; }
  40% { transform: rotateX(-20deg); }
  60% { transform: rotateX(10deg); opacity: 1; }
  80% { transform: rotateX(-5deg); }
  100% { transform: rotateX(0deg); }
}

/* Button Styles */
@property --angle-1 { syntax: "<angle>"; inherits: false; initial-value: -75deg; }
@property --angle-2 { syntax: "<angle>"; inherits: false; initial-value: -45deg; }
:root { --anim--hover-time: 400ms; --anim--hover-ease: cubic-bezier(0.25, 1, 0.5, 1); }

.button-wrap { position: relative; z-index: 2; border-radius: 999vw; background: transparent; transition: all var(--anim--hover-time) var(--anim--hover-ease); }
.button-shadow { position: absolute; width: 100%; height: 100%; top: 0; left: 0; filter: blur(12px); pointer-events: none; }
.glass-button {
  --border-width: 2px;
  all: unset; cursor: pointer; position: relative; z-index: 3;
  border-radius: 999vw;
  background: linear-gradient(-75deg, rgba(1, 255, 203,0.05), rgba(1, 255, 203,0.2), rgba(1, 255, 203,0.05));
  box-shadow: inset 0 0.125em 0.125em rgba(0,0,0,0.05), inset 0 -0.125em 0.125em rgba(255,255,255,0.5), 0 0.25em 0.125em -0.125em rgba(0,0,0,0.2), 0 0 0.1em 0.25em inset rgba(255,255,255,0.2);
  backdrop-filter: blur(4px);
  min-width: 220px; text-align: center; font-size: 20px; display: flex; justify-content: center; align-items: center;
}
.glass-button:hover { transform: scale(0.975); }
.glass-button span { padding: 1em 2em; font-weight: 600; }
</style>
