---
layout: default.njk
title: Booking
---

<style>
    .booking-wrapper {
        width: 100vw;
        min-height: 100vh;
        background-color: #e6dbed;
        padding: 150px 20px 100px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        box-sizing: border-box;
    }

    .booking-page-header {
        text-align: center;
        margin-bottom: 40px;
        max-width: 800px;
        width: 100%;
    }

    .booking-page-title {
        font-family: 'Great Vibes', cursive;
        font-size: clamp(60px, 8vw, 100px);
        color: #351431;
        margin: 0 0 30px 0;
        font-weight: 400;
        line-height: 1.2;
        opacity: 0;
        animation: fadeInDown 1s ease-out forwards;
    }

    .booking-page-subtitle {
        font-size: 1.25rem;
        color: #444444;
        margin: 0;
        opacity: 0;
        animation: fadeInUp 1s ease-out 0.3s forwards;
    }

    @keyframes fadeInDown {
        0% {
            opacity: 0;
            transform: translateY(-30px);
        }

        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeInUp {
        0% {
            opacity: 0;
            transform: translateY(30px);
        }

        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .booking-container {
        max-width: 800px;
        width: 100%;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        padding: 50px;
        box-sizing: border-box;
        opacity: 0;
        animation: fadeInUp 1s ease-out 0.6s forwards;
    }

    .booking-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .booking-title {
        font-family: inherit;
        font-size: 2rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #1a1a1a;
        margin-bottom: 10px;
    }

    .booking-subtitle {
        font-size: 1.1rem;
        color: #555555;
        margin-bottom: 20px;
    }

    .booking-brand {
        font-family: 'Great Vibes', cursive;
        font-size: 3rem;
        color: #351431;
        margin: 0;
        line-height: 1;
    }

    .booking-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full-width {
        grid-column: 1 / -1;
    }

    .form-group label {
        font-weight: 600;
        color: #333333;
        margin-bottom: 8px;
        font-size: 0.95rem;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="tel"],
    .form-group input[type="date"],
    .form-group textarea,
    .form-group select {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #cccccc;
        border-radius: 6px;
        font-family: inherit;
        font-size: 1rem;
        box-sizing: border-box;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        background-color: #fafafa;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
        outline: none;
        border-color: #351431;
        box-shadow: 0 0 0 3px rgba(53, 20, 49, 0.1);
        background-color: #ffffff;
    }

    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }

    /* File upload styles */
    .file-upload-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
        width: 100%;
    }

    .file-upload-wrapper input[type="file"] {
        font-size: 100px;
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        cursor: pointer;
        height: 100%;
    }

    .btn-upload {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px;
        background-color: #f2f8fc;
        color: #351431;
        border: 1px dashed #351431;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease;
        text-align: center;
        box-sizing: border-box;
    }

    .file-upload-wrapper:hover .btn-upload {
        background-color: #e6dbed;
    }

    .submit-btn {
        grid-column: 1 / -1;
        margin-top: 20px;
        padding: 18px;
        background-color: #351431;
        color: #ffffff;
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .submit-btn:hover {
        background-color: #5a2653;
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {
        .booking-form {
            grid-template-columns: 1fr;
        }

        .booking-container {
            padding: 30px 20px;
        }
    }
</style>

<div class="booking-wrapper">
    <!-- NEW OUTSIDE HEADER -->
    <div class="booking-page-header">
        <h1 class="booking-page-title">Book an Appointment</h1>
        <p class="booking-page-subtitle">Please fill out the booking form attached below.</p>
    </div>

    <div class="booking-container">

        <div class="booking-header">
            <h2 class="booking-brand">Feminink</h2>
            <h1 class="booking-title" style="font-size: 1.5rem; margin-top: 5px;">Booking Request Form</h1>
        </div>

        <form action="https://formsubmit.co/13f79a244040b6f194547309b5637bd8" method="POST"
            enctype="multipart/form-data" class="booking-form">
            <!-- Hidden Fields for FormSubmit -->
            <input type="text" name="_honey" style="display:none">
            <input type="hidden" name="_subject" value="New Tattoo Booking Request">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://feminink.ca/thanks">

            <!-- Name -->
            <div class="form-group">
                <label for="first_name">First name*</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last name*</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>

            <!-- Contact -->
            <div class="form-group">
                <label for="phone">Phone*</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email">
            </div>

            <!-- Dates -->
            <div class="form-group full-width">
                <label for="requested_dates">Requested Dates* (Choose a date)</label>
                <input type="date" id="requested_dates" name="requested_dates" required>
            </div>

            <!-- Artist Selection -->
            <div class="form-group full-width">
                <label for="artist">Select Artist*</label>
                <select id="artist" name="artist" required>
                    <option value="" disabled selected>Select an Artist</option>
                    <option value="Faye">Faye</option>
                    <option value="Sam">Sam</option>
                    <option value="Zoe">Zoe</option>
                </select>
            </div>

            <!-- Tattoo Idea -->
            <div class="form-group full-width">
                <label for="tattoo_idea">Describe your tattoo idea in detail*</label>
                <textarea id="tattoo_idea" name="tattoo_idea" rows="4" required></textarea>
            </div>

            <!-- Reference Photo -->
            <div class="form-group full-width">
                <label>Upload a reference photo</label>
                <div class="file-upload-wrapper">
                    <button type="button" class="btn-upload">📁 Upload Picture</button>
                    <input type="file" name="reference_photo" accept="image/*">
                </div>
            </div>

            <!-- Placement -->
            <div class="form-group full-width">
                <label for="placement">Placement on body*</label>
                <input type="text" id="placement" name="placement" required>
            </div>

            <!-- Placement Photo -->
            <div class="form-group full-width">
                <label>Upload a photo of the placement area</label>
                <div class="file-upload-wrapper">
                    <button type="button" class="btn-upload">📁 Upload Picture</button>
                    <input type="file" name="placement_photo" accept="image/*">
                </div>
            </div>

            <!-- Size -->
            <div class="form-group full-width">
                <label for="approx_size">Approximate Size*</label>
                <input type="text" id="approx_size" name="approx_size" required>
            </div>

            <!-- Other Details -->
            <div class="form-group full-width">
                <label for="other_details">Other Details (Such as low pain tolerance, skin conditions, or special
                    requests for the artist)</label>
                <textarea id="other_details" name="other_details" rows="3"></textarea>
            </div>

            <!-- Submit -->
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
</div>
