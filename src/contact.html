<div class="scene">
  <div class="contact-box">
      
      <h1 class="anim-heading">Request a Consultation</h1>
      
      <form action="https://formsubmit.co/fc0da5aa01066bfd0685dcc8fb9f0857" method="POST">
        <input type="text" name="_honey" style="display:none">
        <input type="hidden" name="_subject" value="New Inquiry">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="https://chastech.ca/thanks">

        <div class="input-wrapper anim-name">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="input-wrapper anim-email">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="input-wrapper anim-message">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="3" required></textarea>
        </div>

        <div class="button-row anim-message">
            <button class="sequence-btn contact-submit-btn" type="submit">
                SEND MESSAGE
            </button>
        </div>

    </form>
  </div>
</div>
    
<style>
    @font-face {
        font-family: 'lequire';
        src: url('/leq.otf') format('opentype'); 
    }

    /* --- GLOBAL LAYOUT --- */
    .scene {
        position: relative; /* STRICT MOBILE LOCK: Forces iOS Safari to respect the hidden overflow */
        display: flex;
        justify-content: center;
        overflow-x: hidden; 
        width: 100%; 
        max-width: 100vw; 
        box-sizing: border-box;
        padding: 20px;
    }
    
    #contact-section {
        margin-top: 20px !important;
    }

    /* --- THE COMPACT BOX --- */
    .contact-box {
        position: relative;
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(12px);
        border-radius: 12px;
        box-shadow: 0 8px 10px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.3);
        overflow: hidden; 
        
        /* RESTORED EXACT DESKTOP MATH! This gives you your exact original width back. */
        padding: 30px; 
        max-width: 800px;
        width: 95vw;
        
        opacity: 0;
        /* Note: Removed the hardcoded transform: translateX(100vw) because it is known to cause iOS screen-wobble before the animation even starts */
        animation: slideInFromRight 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* --- THE PURPLE "PIERCE" EFFECT --- */
    .contact-box::before {
        position: absolute;
        content: "";
        width: 600px;
        height: 600px;
        background: rgba(177, 170, 240, 0.5); 
        left: -220px;
        bottom: -50px; /* Adjusted for compact box */
        z-index: 0;
        border-radius: 30px;
        
        /* Animation: Pierce/Strike */
        transform: rotate(45deg) translate(-200px, 200px) scale(0.5);
        opacity: 0;
        animation: pierceEffect 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards;
    }

    /* --- CONTENT STYLING --- */
    .contact-box h1, .contact-box form { position: relative; z-index: 2; }

    .anim-heading {
        font-size: 2.2rem;
        color: #191f4f;
        margin-bottom: 20px; /* Reduced margin */
        line-height: 1.1;
        font-weight: 800;
        text-align: center;
        
        /* Fade In */
        opacity: 0;
        animation: simpleFadeIn 0.8s ease-out 1.0s forwards;
    }

    .input-wrapper {
        margin-bottom: 15px; /* Reduced spacing */
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
        color: #191f4f;
        font-size: 0.95rem;
    }

    input, textarea {
        width: 100%;
        padding: 10px; /* Tighter padding */
        border: 1px solid #ccc;
        border-radius: 20px;
        background: white;
        box-sizing: border-box;
    }

    /* --- SEQUENTIAL ANIMATIONS (RESTORED) --- */

    /* Name: Drops from Top (1.3s) */
    .anim-name {
        opacity: 0;
        animation: fadeInTop 0.8s ease-out 1.3s forwards;
    }

    /* Email: Slides from Left (1.6s) */
    .anim-email {
        opacity: 0;
        animation: fadeInLeft 0.8s ease-out 1.6s forwards;
    }

    /* Message & Button: Rise from Bottom (1.9s) */
    .anim-message {
        opacity: 0;
        animation: fadeInBottom 0.8s ease-out 1.9s forwards;
    }

    .button-row {
        display: flex;
        justify-content: center;
        width: 100%;
        margin-top: 15px;
    }

    .sequence-btn {
        display: inline-block;
        padding: 14px 45px;
        background: linear-gradient(90deg, #191f4f, #436aee);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: bold;
        font-size: 1.1rem;
        cursor: pointer;
        width: 100%;
        max-width: 300px;
        transition: transform 0.3s ease;
    }

    /* --- KEYFRAMES --- */

    @keyframes slideInFromRight {
        0% { opacity: 0; transform: translateX(100px); }
        100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes pierceEffect {
        0% { opacity: 0; transform: rotate(45deg) translate(-300px, 300px) scale(0.5); }
        100% { opacity: 1; transform: rotate(45deg) translate(0, 0) scale(1); }
    }

    @keyframes simpleFadeIn { to { opacity: 1; } }

    @keyframes fadeInTop {
        0% { opacity: 0; transform: translateY(-30px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInLeft {
        0% { opacity: 0; transform: translateX(-30px); }
        100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeInBottom {
        0% { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1024px) {
        .contact-box { padding: 25px; } /* Even tighter on mobile */
        .scene { margin-top: 50px; }
    }
</style>
