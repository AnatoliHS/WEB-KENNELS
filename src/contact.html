layout: default
title: Contact Us

<section class="contact-page-section">
    <div class="contact-page-container">
        <!-- Direct 50/50 Split -->
        <div class="contact-info-panel">
            <h1 class="contact-header">CONTACT US TODAY!</h1>
            <div class="info-block">
                <p class="info-label">Name:</p>
                <p class="info-value">Kristina Osborne</p>
            </div>
            <div class="info-block">
                <p class="info-label">Email:</p>
                <p class="info-value"><a href="mailto:wildernesskennels@outlook.com">wildernesskennels@outlook.com</a>
                </p>
            </div>
        </div>

        <div class="contact-form-panel">
            <!-- UPDATED: Using random key endpoint to prevent 405 Method Not Allowed errors -->
            <form action="https://formsubmit.co/e8e9edb58586b242aa6a0e3755cb76f2" method="POST"
                class="modern-contact-form">

                <!-- FormSubmit Configuration -->
                <input type="text" name="_honey" style="display:none">
                <input type="hidden" name="_subject" value="New Contact Form Submission!">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_captcha" value="false">



                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="What is this about?">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Your Message..." required></textarea>
                </div>
                <button type="submit" class="button type--C">
                    <span class="btn-text">SEND MESSAGE</span>
                </button>
            </form>
        </div>
    </div>
</section>
