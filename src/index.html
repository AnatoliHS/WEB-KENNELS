---
layout: landing.njk
---

<div class="logo-container">
  <img src="/assets/WW.png" alt="Company Logo" class="site-logo">
</div>

<div class="intro-container">
  <div class="inner-container">
    <h1 class="gradient-text">
      Work Smart. Stay Safe. Be WHMIS Wise
    </h1>
    <p>
      We provide industry-focused WHMIS training, including Regular, Dental, and Pharmacy courses, designed to ensure workplace safety, regulatory compliance, and informed handling of hazardous materials.
    </p>
  </div>
</div>

 <div class="button-container">
    <div class="button-row">
      <div class="button-wrap" onclick="location.href='/homeReg/'">
        <button class="glass-button">
          <img src="/assets/whimiswise2.png" alt="Regular WHMIS">
        </button>
        <div class="button-shadow"></div>
      </div>

      <div class="button-wrap" onclick="location.href='/homePharm/'">
        <button class="glass-button">
          <img src="/assets/pharmaWhmis2.png" alt="Regular WHMIS">
        </button>
        <div class="button-shadow"></div>
      </div>

      <div class="button-wrap" onclick="location.href='/homeDent/'">
        <button class="glass-button">
          <img src="/assets/whimiswise.png" alt="Regular WHMIS">
        </button>
        <div class="button-shadow"></div>
      </div>
    
  </div>

 
<style>
/* === Gradient text (your existing style) === */
.gradient-text { 
  font-size: 2.5rem;
  font-weight: bold;
  background: linear-gradient(90deg, #00c6ff, #0072ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  -webkit-text-stroke: 0.3px grey;
  background-clip: text;
  text-fill-color: transparent;
}

.intro-container {
  display: flex;
  justify-content: center;   /* centers horizontally */
  align-items: center;       /* centers vertically if you give container height */
  text-align: center;        /* centers inline text inside */
  padding: 20px;
}

.inner-container {
  max-width: 900px; /* keeps text from stretching too wide */
  margin: 0 auto;
}

.intro-container p {
  font-size: 28px;       /* default font size for larger screens */
  line-height: 1.6;
}

.logo-container {
  display: flex;
  justify-content: center;  /* centers logo horizontally */
  
}

.site-logo {
  max-width: 300px;        /* adjust logo size */
  height: auto;
}

.button-row {
  display: flex;
  justify-content: center; /* centers the row */
  gap: 20px;              /* space between buttons */
  margin-top: 30px;       /* space above the buttons */
  flex-wrap: wrap;        /* wraps on small screens */
}

@property --angle-1 {
      syntax: "<angle>";
      inherits: false;
      initial-value: -75deg;
    }

    @property --angle-2 {
      syntax: "<angle>";
      inherits: false;
      initial-value: -45deg;
    }

    :root {
      --global--size: clamp(2rem, 4vw, 5rem);
      --anim--hover-time: 400ms;
      --anim--hover-ease: cubic-bezier(0.25, 1, 0.5, 1);
    }

.button-wrap {
      position: relative;
      z-index: 2;
      border-radius: 999vw;
      background: transparent;
      pointer-events: none;
      transition: all var(--anim--hover-time) var(--anim--hover-ease);
    }

    .button-shadow {
      --shadow-cuttoff-fix: 2em;
      position: absolute;
      width: calc(100% + var(--shadow-cuttoff-fix));
      height: calc(100% + var(--shadow-cuttoff-fix));
      top: calc(0% - var(--shadow-cuttoff-fix) / 2);
      left: calc(0% - var(--shadow-cuttoff-fix) / 2);
      filter: blur(clamp(2px, 0.125em, 12px));
      pointer-events: none;
    }

    .button-shadow::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999vw;
      background: linear-gradient(180deg, rgba(0,0,0,0.2), rgba(0,0,0,0.1));
      width: calc(100% - var(--shadow-cuttoff-fix) - 0.25em);
      height: calc(100% - var(--shadow-cuttoff-fix) - 0.25em);
      top: calc(var(--shadow-cuttoff-fix) - 0.5em);
      left: calc(var(--shadow-cuttoff-fix) - 0.875em);
      padding: 0.125em;
      box-sizing: border-box;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
    }

    .glass-button {
      --border-width: clamp(1px, 0.0625em, 4px);
      all: unset;
      cursor: pointer;
      position: relative;
      z-index: 3;
      pointer-events: auto;
      border-radius: 999vw;
      background: linear-gradient(-75deg, rgba(1, 255, 203,0.05), rgba(1, 255, 203,0.2), rgba(1, 255, 203,0.05));
      box-shadow:
        inset 0 0.125em 0.125em rgba(0,0,0,0.05),
        inset 0 -0.125em 0.125em rgba(255,255,255,0.5),
        0 0.25em 0.125em -0.125em rgba(0,0,0,0.2),
        0 0 0.1em 0.25em inset rgba(255,255,255,0.2),
        0 0 0 0 rgba(255,255,255,1);
      backdrop-filter: blur(clamp(1px, 0.125em, 4px));
      transition: all var(--anim--hover-time) var(--anim--hover-ease);
      min-width: 220px;
      text-align: center;
      font-size: 25px;
      -webkit-tap-highlight-color: transparent;
          -webkit-touch-callout: none;
          user-select: none;
    }

    .glass-button img {
  max-width: 150px; /* adjust as needed */
  height: auto;
  display: block;
  margin: 0 auto; /* center image inside button */
}

    .glass-button:hover {
      transform: scale(0.975);
      backdrop-filter: blur(0.01em);
      box-shadow:
        inset 0 0.125em 0.125em rgba(0,0,0,0.05),
        inset 0 -0.125em 0.125em rgba(255,255,255,0.5),
        0 0.15em 0.05em -0.1em rgba(0,0,0,0.25),
        0 0 0.05em 0.1em inset rgba(255,255,255,0.5),
        0 0 0 0 rgba(255,255,255,1);
    }

    .glass-button span {
      display: block;
      position: relative;
      font-weight: 500;
      letter-spacing: -0.05em;
      color: #323232;
      text-shadow: 0em 0.25em 0.05em rgba(0,0,0,0.1);
      padding: 0.875em 1.5em;
    }

    .glass-button span::after {
      content: "";
      position: absolute;
      z-index: 1;
      width: calc(100% - var(--border-width));
      height: calc(100% - var(--border-width));
      top: calc(var(--border-width) / 2);
      left: calc(var(--border-width) / 2);
      border-radius: 999vw;
      background: linear-gradient(var(--angle-2), rgba(255,255,255,0) 0%, rgba(255,255,255,0.5) 40% 50%, rgba(255,255,255,0) 55%);
      background-size: 200% 200%;
      background-position: 0% 50%;
      mix-blend-mode: screen;
      pointer-events: none;
      transition: background-position calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease), --angle-2 calc(var(--anim--hover-time) * 1.25) var(--anim--hover-ease);
    }

    .glass-button:hover span::after {
      background-position: 25% 50%;
    }

    .glass-button:active span::after {
      background-position: 50% 15%;
      --angle-2: -15deg;
    }

    .glass-button::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 999vw;
      width: calc(100% + var(--border-width));
      height: calc(100% + var(--border-width));
      top: calc(0% - var(--border-width) / 2);
      left: calc(0% - var(--border-width) / 2);
      padding: var(--border-width);
      background: conic-gradient(
        from var(--angle-1) at 50% 50%,
        rgba(0,0,0,0.5),
        rgba(0,0,0,0) 5% 40%,
        rgba(0,0,0,0.5) 50%,
        rgba(0,0,0,0) 60% 95%,
        rgba(0,0,0,0.5)
      ),
      linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.5));
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      transition: all var(--anim--hover-time) var(--anim--hover-ease), --angle-1 500ms ease;
      box-shadow: inset 0 0 0 calc(var(--border-width) / 2) rgba(255,255,255,0.5);
    }

    .glass-button:hover::after {
      --angle-1: -125deg;
    }

    .glass-button:active::after {
      --angle-1: -75deg;
    }

    .button-container {
      --w: 100%;
      --ai: center;
      --fd: column;
      --d: flex;
      --mt: 50px;
      display: flex;
      align-items: center;
      flex-direction: column;
      margin-top: 100px;
    }

    .button-row {
      display: flex;
      justify-content: center;
      flex-direction: row;
      flex-wrap: wrap;
      max-width: 1100px;
      padding: 0 5vw;
      gap: 80px;
      margin-bottom: 120px;
      margin-top: -30px;
    }



@media (max-width: 768px) {



  .intro-container {
    opacity: 1 !important;
    transform: scale(1) !important;
    transition: none;
  }

  .intro-container p {
    font-size: 20px;     /* smaller font size for mobile */
  }
}
</style>
